[project]
name = "medimind-backend"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 130
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["B008", "S101"]  # Depends() dans les signatures FastAPI ; assert dans les tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]  # mots de passe factices des tests
"tests/conftest.py" = ["E402"]  # variables d environnement posées avant l import de l application

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
