name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Tesseract (OCR français)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-fra
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Tests (pytest) et couverture des services (au moins 80 %)
        run: pytest --cov=app/services --cov-report=term --cov-fail-under=80

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      - name: Typage et build
        run: npm run build

  e2e:
    # Pile complète (images construites comme en production), jeu de démo, scénario du parcours A dans Chromium
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fichier .env de test (secrets aléatoires)
        run: |
          python - <<'PY'
          import secrets
          s = open(".env.example", encoding="utf-8").read()
          for key in ("POSTGRES_PASSWORD", "ADMIN_PASSWORD"):
              s = s.replace(f"{key}=a-changer", f"{key}={secrets.token_urlsafe(24)}")
          s = s.replace("JWT_SECRET=a-changer", f"JWT_SECRET={secrets.token_urlsafe(48)}")
          open(".env", "w", encoding="utf-8").write(s)
          PY
      - name: Construction et démarrage de la pile
        run: docker compose up -d --build --wait
      - name: Outils de test
        run: |
          pip install httpx -r e2e/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Jeu de démonstration
        run: python scripts/seed_demo.py
      - name: Scénario de démonstration (Playwright)
        run: pytest e2e -v
      - name: Budgets de performance (indicatif sur la machine de CI)
        continue-on-error: true
        run: python scripts/perf.py
      - name: Journaux en cas d'échec
        if: failure()
        run: docker compose logs --tail=200
